name: CI

# A newer push to the same PR obsoletes the running build: cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Linux only, deliberately. Raven mounts overlayfs and registers
    # binfmt_misc; neither concept exists on the other platforms the
    # organisation targets, so a matrix here would be three jobs to prove that
    # two of them cannot work.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to master with `toolchain: stable` rather than to the `stable`
      # branch: that branch is rebased onto every master commit, so a SHA
      # pinned on it stops being reachable from any branch.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The mount tests skip themselves where unprivileged user namespaces are
      # restricted, which is the default on recent Ubuntu. That is the right
      # behaviour - a developer's machine should not fail a test for a kernel
      # policy - but a suite that silently skips its most important tests looks
      # green while proving nothing. So the state is printed, in the log, every
      # run.
      - name: Report what the runner allows
        run: |
          echo "max_user_namespaces: $(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo unavailable)"
          echo "apparmor userns restriction: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo none)"
          echo "If the first is 0, the mount tests below skip; the second is lifted by the next step."

      # Ubuntu runners restrict unprivileged user namespaces through AppArmor,
      # and the mount tests need them. Lift the restriction for this job so they
      # run rather than skip; the step above still records what the runner
      # allowed before it.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # `--locked` was the gap: the release workflow and the PKGBUILD both
      # build locked, so a Cargo.lock that no longer agreed with Cargo.toml
      # passed every check and then failed the release, where it is expensive
      # and public. It is asserted here rather than by a second, fat-LTO
      # release build, which would cost minutes to learn the same thing.
      - name: Test
        run: cargo test --verbose --locked

  # The org rule is that every dependency sits on its latest release. This makes
  # drift visible in a diff rather than leaving it to be discovered later.
  outdated:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - name: Show anything not on its latest release
        run: |
          cargo install cargo-outdated --locked
          cargo outdated --root-deps-only --exit-code 0

  # `rust-version` in Cargo.toml is a promise about who can build Raven; this
  # job is what keeps it one. 1.88 is the floor iced 0.14 and wgpu 27 declare,
  # so the GUI cannot build on anything older. Raise both together, on
  # purpose, never because a dependency moved its own floor.
  msrv:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build on the declared rust-version
        run: cargo build --workspace --locked --all-targets
