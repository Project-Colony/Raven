# Makes the kernel recognise Windows executables and hand them to Raven.
#
# Installed to /etc/binfmt.d/ and applied by systemd-binfmt at boot. This is the
# one step that needs root, and it happens once at install time rather than from
# a service that keeps privilege while Raven runs.
#
# Fields: name, type (Magic), offset, magic, mask, interpreter, flags.
#
# The F flag makes the kernel open the interpreter at registration time and hold
# it open. Without it the path is resolved at exec time in the caller's mount
# namespace - which for Raven is one where /usr/bin may not hold what it did.
:raven-pe:M::MZ::/usr/bin/raven:F
