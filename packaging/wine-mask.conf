# Masks /usr/lib/binfmt.d/wine.conf.
#
# Wine's package registers :DOSWin: for the same MZ magic Raven registers for,
# and the kernel silently picks whichever registered last - so a Wine update
# can take every .exe back at any time, sending it to the default ~/.wine
# prefix instead of to an environment.
#
# systemd's binfmt.d takes a file in /etc over one of the same name in
# /usr/lib, so an empty file here disables Wine's registration without editing
# a package-owned file. Deleting this file restores it.
