[package]
name = "raven"
description = "Run Windows programs on Linux against a real Windows installation mounted as C:"
version = "0.3.0" # x-release-please-version
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/Raven"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
nt-hive = "0.3.0"
rustix = { version = "1.1.4", features = ["mount", "thread", "process", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.4"

[dev-dependencies]
regf = "0.1.0"

# raven runs once per .exe launch, so what matters is start-up and size, both
# measured before and after (numbers in the commit that added this).
# `panic = "abort"` is deliberately not set: it trades backtraces away for
# little, and that decision is recorded in docs/project/consolidation.md.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
