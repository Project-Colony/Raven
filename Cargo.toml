[workspace]
resolver = "3"
members = ["crates/raven", "crates/raven-gui"]

# Shared by both crates so they cannot drift apart: the GUI is unusable
# against a library of a different age, and release-please gives them one
# version.
[workspace.package]
version = "0.4.2" # x-release-please-version
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/Raven"
edition = "2024"
rust-version = "1.88"

# Every dependency is declared once, here, at its full current version, and the
# crates inherit it with `dep.workspace = true`. Features stay with the crate
# that needs them. `raven` is path-only on purpose: release-please rewrites the
# version in [workspace.package], and a version field here would be a second
# copy it does not know about.
[workspace.dependencies]
raven = { path = "crates/raven" }
anyhow = "1.0.104"
clap = "4.6.7"
colony-ui = "0.1.6"
iced = "0.14.0"
nt-hive = "0.3.0"
regf = "0.1.0"
rustix = "1.1.5"
serde = "1.0.229"
thiserror = "2.0.21"
tokio = "1.53.2"
toml = "1.1.8"

# Two binaries share this profile now, and they are paid for by different
# people. `raven` runs once per .exe launch, so start-up and size are all that
# matter, and both were measured before and after (numbers in the commit that
# added this). `raven-gui` gains nothing measurable from either setting - it is
# opened by hand, once, and then stays open - and pays for them in compile
# time, since it links wgpu and iced under one codegen unit. The settings are
# kept anyway: they are here for the launcher, which is the binary on the hot
# path, and a second profile for the window would buy a faster build at the
# cost of two release binaries built two different ways.
# `panic = "abort"` is deliberately not set: it trades backtraces away for
# little, and that decision is recorded in docs/project/consolidation.md.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
