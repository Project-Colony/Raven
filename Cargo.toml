[workspace]
resolver = "3"
members = ["crates/raven", "crates/raven-gui"]

# Shared by both crates so they cannot drift apart: the GUI is unusable
# against a library of a different age, and release-please gives them one
# version.
[workspace.package]
version = "0.5.2" # x-release-please-version
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/Raven"
edition = "2024"
rust-version = "1.88"

# Every dependency is declared once, here, at its full current version, and the
# crates inherit it with `dep.workspace = true`. Features stay with the crate
# that needs them. `raven` is path-only on purpose: release-please rewrites the
# version in [workspace.package], and a version field here would be a second
# copy it does not know about.
[workspace.dependencies]
raven = { path = "crates/raven" }
anyhow = "1.0.104"
clap = "4.6.7"
colony-ui = "0.1.6"
iced = "0.14.0"
nt-hive = "0.3.0"
regf = "0.1.0"
rustix = "1.1.5"
serde = "1.0.229"
thiserror = "2.0.21"
tokio = "1.53.3"
toml = "1.1.8"

# The organisation's release profile (Project-Colony-Resources,
# design/releases.md, "Release profile"), shared by both binaries so they are
# built one way. `raven` runs once per .exe launch, so start-up and size are
# what it pays for. Against the default profile, the first measured profile (fat
# LTO) took it from 1.9 MB to 1.2 MB and left start-up unchanged within noise
# (numbers in docs/project/consolidation.md, 3.1). Fat LTO bought no start-up,
# so Raven uses the organisation's thin LTO, which also links `raven-gui` (wgpu
# and iced under one codegen unit) faster.
# `panic = "abort"` is deliberately not set: it trades backtraces away for
# little, and that decision is recorded in docs/project/consolidation.md.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
